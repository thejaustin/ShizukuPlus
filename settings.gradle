dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        mavenLocal()
        maven {
            url = "https://jitpack.io"
            content {
                includeGroup("com.github.topjohnwu.libsu")
                includeGroup("com.github.Dimezis")
            }
        }
    }
}

include ":server", ":starter", ":shell", ":manager", ":common", ":database", ":compat", ":dhizuku-compat", ":app-process"
include ":core:ui"
project(":core:ui").projectDir = file("core/ui")

def root = "api"

def propFile = file("local.properties")
def props = new Properties()

if (propFile.canRead()) {
    props.load(new FileInputStream(propFile))

    if (props != null) {
        if (props["api.useLocal"].equals("true")) {
            root = props["api.dir"]
        }
    }
}

// The API modules live in the api/ git submodule. Without it Gradle fails with "Configuring
// project ':rish' without an existing directory"; say what to do instead.
// GitHub's automatic dependency submission checks the repo out without submodules and can't be
// told otherwise, so on CI fetch it here (it's public) instead of failing every run.
if (!file("$root${File.separator}api").isDirectory() && root == "api" && System.getenv("GITHUB_ACTIONS") == "true") {
    def fetch = ["git", "submodule", "update", "--init", "--recursive"].execute(null, settingsDir)
    fetch.waitForProcessOutput(System.out, System.err)
}
if (!file("$root${File.separator}api").isDirectory()) {
    throw new GradleException("The api submodule is missing. Run: git submodule update --init --recursive")
}

include ":aidl"
project(":aidl").projectDir = file("$root${File.separator}aidl")

include ":rish"
project(":rish").projectDir = file("$root${File.separator}rish")

include ":shared"
project(":shared").projectDir = file("$root${File.separator}shared")

include ":api"
project(":api").projectDir = file("$root${File.separator}api")

include ":provider"
project(":provider").projectDir = file("$root${File.separator}provider")

include ":server-shared"
project(":server-shared").projectDir = file("$root${File.separator}server-shared")
