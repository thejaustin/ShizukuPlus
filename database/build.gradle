plugins {
    id "com.android.library"
    id "com.google.devtools.ksp"
    id "org.jetbrains.kotlin.plugin.serialization"
}

android {
    namespace = "af.shizuku.manager.database"
    compileSdk = 37

    defaultConfig {
        minSdk = 24
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }


    testOptions {
        unitTests {
            includeAndroidResources = true
        }
        unitTests.all {
            useJUnitPlatform()
        }
    }
}

dependencies {
    api libs.room.runtime
    api libs.room.ktx
    ksp libs.room.compiler

    implementation project(":common")
    implementation project(":api")
    
    implementation libs.androidx.core.ktx
    implementation libs.timber
    implementation libs.kotlinx.coroutines.core
    implementation libs.kotlinx.serialization.json
    implementation libs.play.integrity

    testImplementation libs.kotest.runner.junit6
    // Keeps every JUnit Platform artifact (launcher from Kotest, engine from vintage) on one version.
    testImplementation platform(libs.junit.bom)
    testImplementation libs.robolectric
    // Runs the JUnit 4 tests (ActivityLogDaoTest) under useJUnitPlatform(); without it they're skipped.
    testRuntimeOnly libs.junit.vintage.engine
    testImplementation libs.kotlinx.coroutines.test
    testImplementation libs.androidx.test.core
    testImplementation libs.room.testing
}
