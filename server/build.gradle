plugins {
    id "com.android.library"
    id "dev.rikka.tools.refine"
}

android {
    namespace = "af.shizuku.server"
    buildFeatures {
        buildConfig = false
    }
}

dependencies {
    implementation libs.androidx.annotation
    implementation "com.google.code.gson:gson:2.13.1"
    api "dev.rikka.rikkax.parcelablelist:parcelablelist:2.0.1"

    implementation project(":aidl")
    implementation project(":common")
    implementation project(":shared")
    compileOnly project(":provider")
    implementation project(":starter")
    implementation project(":rish")
    implementation project(":server-shared")
    implementation libs.rikkax.core
    implementation libs.hidden.compat
    compileOnly libs.hidden.stub
}
dependencies {
    testImplementation libs.kotest.runner.junit6
    // Keeps every JUnit Platform artifact (launcher from Kotest, engine from vintage) on one version.
    testImplementation platform(libs.junit.bom)
    testImplementation "org.jetbrains.kotlin:kotlin-test:2.4.21"
    testImplementation "io.mockk:mockk:1.13.13"
    // The existing tests use JUnit 4 annotations (as :manager does); without it they do not compile.
    testImplementation "junit:junit:4.13.2"
    // Runs the JUnit 4 tests (AICorePlusImplTest) under useJUnitPlatform(); without it they're skipped.
    testRuntimeOnly libs.junit.vintage.engine
    // Hidden framework classes (IUserManager, IIntentReceiver, ...) the code under test refers to;
    // compileOnly does not put them on the test classpath.
    testImplementation libs.hidden.stub
}
android {
    testOptions {
        unitTests.all { t ->
            t.useJUnitPlatform()
            // MockK needs ByteBuddy's agent. Load it up front instead of self-attaching, which
            // JDK 21 discourages and which fails outright on some JVMs (e.g. Termux on-device).
            t.doFirst {
                def bbAgent = t.classpath.find { it.name.startsWith("byte-buddy-agent") }
                if (bbAgent != null) t.jvmArgs "-javaagent:${bbAgent}"
            }
        }
        unitTests.returnDefaultValues = true
    }
}
