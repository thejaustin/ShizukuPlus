buildscript {
    configurations.all {
        resolutionStrategy {
            force "org.bouncycastle:bcprov-jdk18on:1.86"
            force "org.bouncycastle:bcpkix-jdk18on:1.86"
            force "com.google.guava:guava:33.7.1-android"
            force "org.apache.commons:commons-lang3:3.18.0"
            force "org.apache.httpcomponents:httpclient:4.5.14"
        }
    }
}

plugins {
    id "idea"
    id "com.android.library" apply false
    id "com.google.devtools.ksp" version "2.3.6" apply false
    id "io.gitlab.arturbosch.detekt" version "1.23.6" apply false
}

allprojects {
    configurations.all {
        resolutionStrategy {
            force "org.bouncycastle:bcprov-jdk18on:1.86"
            force "org.bouncycastle:bcpkix-jdk18on:1.86"
            force "com.google.guava:guava:33.7.1-android"
            force "org.apache.commons:commons-lang3:3.18.0"
            force "org.apache.httpcomponents:httpclient:4.5.14"
        }
    }
}

idea.module {
    excludeDirs += file("out")
}

def getGitCommitCount() {
    try {
        // Pass null (not []) so the subprocess inherits the parent process environment (including PATH).
        // Passing an empty list strips env vars and prevents git from being found in non-standard PATH setups.
        return Integer.parseInt("git rev-list --count HEAD".execute((List) null, project.rootDir).text.trim())
    } catch (Exception ignored) {
        return 0
    }
}

// Tracks the upstream thedjchi/Shizuku release this fork is based on.
// Bump when a new upstream stable lands (check https://github.com/thedjchi/Shizuku/releases).
def upstreamVersion = "13.7.0"

def gitCommitCount = getGitCommitCount()
ext {
    versionCode = gitCommitCount
    versionName = "Shizuku+ ${upstreamVersion}.r${gitCommitCount}"
}

subprojects {
    apply plugin: "io.gitlab.arturbosch.detekt"

    detekt {
        config.setFrom(files("$rootDir/detekt.yml"))
        buildUponDefaultConfig = true
        autoCorrect = true
    }

    dependencies {
        detektPlugins "io.gitlab.arturbosch.detekt:detekt-formatting:1.23.6"
    }

    plugins.withId("com.android.base") {
        android {
            compileSdk = 37
            buildToolsVersion = "36.0.0"
            defaultConfig {
                minSdk = 24
                targetSdk = 36
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_21
                targetCompatibility = JavaVersion.VERSION_21
            }
        }
    }
}
