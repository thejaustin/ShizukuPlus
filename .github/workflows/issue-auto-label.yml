name: Issue Auto-Label

on:
  issues:
    types: [opened, edited]

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Auto-label from the form and from clear keywords
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            const text = `${issue.title}\n${body}`.toLowerCase();
            const labels = new Set();

            // Form dropdowns (exact option text)
            const forms = {
              'Manager App (UI/Settings)': 'module: manager-app',
              'Server/Service': 'module: server',
              'API/AIDL': 'module: api',
              'Rish (Command Line)': 'module: rish-cli',
              'Translation/Localization': 'module: translation',
              'Shizuku+ (Plus)': 'flavor: plus',
              'Drop-In (original Shizuku package)': 'flavor: drop-in',
              'Samsung (One UI)': 'device: samsung',
              'Pixel / stock Android': 'device: pixel',
            };
            for (const [option, label] of Object.entries(forms)) {
              if (body.includes(option)) labels.add(label);
            }

            // Keywords only when specific enough to be right; a person can always fix a label.
            const keywords = [
              [/dhizuku|device owner/, 'area: dhizuku'],
              [/root compat|su bridge|\bsu\b binary|start with root/, 'area: root-compat'],
              [/what'?s new|release notes|changelog/, 'area: whats-new'],
              [/service doctor|\bdoctor\b/, 'area: doctor'],
              [/onboarding|first run|pairing code/, 'area: onboarding'],
            ];
            for (const [re, label] of keywords) if (re.test(text)) labels.add(label);

            // Don't re-add something a maintainer removed on purpose after the first pass.
            if (context.payload.action === 'edited') {
              const events = await github.paginate(github.rest.issues.listEvents, {
                owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number,
              });
              for (const e of events) if (e.event === 'unlabeled' && e.label) labels.delete(e.label.name);
            }

            const existing = new Set(issue.labels.map((l) => l.name));
            const add = [...labels].filter((l) => !existing.has(l));
            if (add.length) {
              core.info(`Adding labels: ${add.join(', ')}`);
              await github.rest.issues.addLabels({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, labels: add,
              });
            }
