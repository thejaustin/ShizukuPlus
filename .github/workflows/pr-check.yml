name: PR Check

on:
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - 'LICENSE*'

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Cache Android SDK
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            /usr/local/lib/android/sdk/build-tools
            /usr/local/lib/android/sdk/platforms
            /usr/local/lib/android/sdk/platform-tools
          key: android-sdk-${{ runner.os }}-${{ hashFiles('manager/build.gradle', 'gradle/libs.versions.toml') }}
          restore-keys: |
            android-sdk-${{ runner.os }}-

      - name: Pre-Push Guard
        run: |
          chmod +x pre-push-guard/scripts/pre_push_check.sh
          bash pre-push-guard/scripts/pre_push_check.sh

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Accept SDK Licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Verify Code Formatting
        run: ./gradlew spotlessCheck

      - name: Run Lint
        run: ./gradlew :manager:lint

      - name: Build Debug APK
        run: ./gradlew :manager:assembleDebug
