name: Needs-info reminder

# A gentle nudge, once, when we asked for details and the thread has gone quiet. It never closes
# anything: people are busy, and a late answer is still worth having.
on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const MARK = '<!-- needs-info-reminder -->';
            const QUIET_DAYS = 14;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'status: needs-info', per_page: 100,
            });
            for (const issue of issues) {
              if (issue.pull_request) continue;
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number,
              });
              if (comments.some((c) => c.body && c.body.includes(MARK))) continue;
              const last = comments.length ? new Date(comments[comments.length - 1].updated_at) : new Date(issue.updated_at);
              if ((Date.now() - last) / 86400000 < QUIET_DAYS) continue;
              // Only if the last word was ours, not the reporter's.
              const lastAuthor = comments.length ? comments[comments.length - 1].user.login : null;
              if (lastAuthor === issue.user.login) continue;
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number,
                body: `${MARK}\nHi @${issue.user.login}, just a gentle nudge: we're still missing a few details to look into this. No rush, and if it has fixed itself or you've moved on, that's fine too. If you can share the info above (or a Doctor / Activity log report from the app), we'll pick it back up.\n\n_This is an automated reminder; it will not be repeated and the issue stays open._`,
              });
            }
