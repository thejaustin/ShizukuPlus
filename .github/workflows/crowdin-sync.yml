name: Crowdin Sync

on:
  push:
    branches: [master]
    paths:
      - 'manager/src/main/res/values/strings.xml'
      - 'manager/src/main/res/values/strings_companion.xml'
      - 'manager/src/main/res/values-*/strings.xml'
      - 'manager/src/main/res/values-*/strings_companion.xml'
  schedule:
    # Weekly Monday 06:00 UTC — pull approved translations and open a PR
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      direction:
        description: 'upload (push sources & translations to Crowdin) or download (pull translations)'
        required: true
        default: 'upload'
        type: choice
        options: [upload, download]

permissions:
  contents: write
  pull-requests: write

jobs:
  upload-sources:
    name: Upload source strings & translations to Crowdin
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.direction == 'upload')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Upload sources & existing translations
        uses: crowdin/github-action@8f01d54f70f1713ee3f09d82c2bbb2daeac28689 # v2
        with:
          upload_sources: true
          upload_translations: true
          auto_approve_imported: true
          import_eq_suggestions: true
          crowdin_branch_name: master
          config: crowdin.yml
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_TOKEN }}

  download-translations:
    name: Download translations from Crowdin → open PR
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.direction == 'download')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download approved translations
        uses: crowdin/github-action@8f01d54f70f1713ee3f09d82c2bbb2daeac28689 # v2
        with:
          upload_sources: false
          download_translations: true
          create_pull_request: true
          pull_request_title: 'chore(i18n): sync translations from Crowdin'
          pull_request_body: |
            Automated translation sync from Crowdin.

            Includes all strings approved by translation reviewers since the last sync.
            Please review for any unexpected changes before merging.
          pull_request_labels: 'type: enhancement'
          localization_branch_name: crowdin-translations
          crowdin_branch_name: master
          skip_untranslated_strings: false
          config: crowdin.yml
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
