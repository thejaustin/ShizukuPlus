name: Crowdin Sync

on:
  push:
    branches: [master]
    paths:
      - 'manager/src/main/res/values/strings.xml'
      - 'manager/src/main/res/values/strings_companion.xml'
  schedule:
    # Weekly Monday 06:17 UTC (off the top of the hour, where scheduled runs get delayed or dropped) — pull approved translations and open a PR
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      direction:
        description: 'upload (push English source strings to Crowdin) or download (pull translations)'
        required: true
        default: 'upload'
        type: choice
        options: [upload, download, status]
      upload_translations:
        description: 'With upload: also send the repo translations to Crowdin (unapproved; seed Crowdin with this once)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  upload-sources:
    name: Upload source strings to Crowdin
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.direction == 'upload')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Translations are only uploaded on request and never auto-approved, so machine drafts
      # from scripts/i18n/local_translate.py can't overwrite translators' approved work.
      - name: Upload sources
        uses: crowdin/github-action@8f01d54f70f1713ee3f09d82c2bbb2daeac28689 # v2
        with:
          upload_sources: true
          upload_translations: ${{ github.event.inputs.upload_translations == 'true' }}
          auto_approve_imported: false
          import_eq_suggestions: false
          crowdin_branch_name: master
          config: crowdin.yml
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_TOKEN }}

      - name: Report Sync Summary
        if: success()
        run: |
          echo "### 🌐 Crowdin Translation Sync Status" >> $GITHUB_STEP_SUMMARY
          echo "Source strings synced with Crowdin project [Shizuku+](https://crowdin.com/project/ShizukuPlus)." >> $GITHUB_STEP_SUMMARY

      - name: Report Sync Failure
        if: failure()
        run: |
          echo "### ❌ Crowdin Translation Sync Failed" >> $GITHUB_STEP_SUMMARY
          echo "Upload to Crowdin failed; see the step log. A 402 error means the Crowdin plan or licence has lapsed." >> $GITHUB_STEP_SUMMARY

  download-translations:
    name: Download translations from Crowdin → open PR
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.direction == 'download')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download approved translations
        uses: crowdin/github-action@8f01d54f70f1713ee3f09d82c2bbb2daeac28689 # v2
        with:
          upload_sources: false
          download_translations: true
          create_pull_request: true
          pull_request_title: 'chore(i18n): sync translations from Crowdin'
          pull_request_body: |
            Automated translation sync from Crowdin.

            Includes every translation Crowdin holds for the strings in the app, approved or not
            (Crowdin's export isn't limited to approved work, so repo translations seeded earlier
            stay in). Machine drafts that a translation now covers are dropped in a follow-up
            commit. Check that lint-and-build is green and skim the diff before merging.
          pull_request_labels: 'type: enhancement'
          localization_branch_name: crowdin-translations
          crowdin_branch_name: master
          # Untranslated strings would otherwise be written out in English and clash with
          # strings_machine_translated.xml; leaving them out lets Android fall back to English.
          skip_untranslated_strings: true
          config: crowdin.yml
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_TOKEN }}
          # A PR opened with the built-in GITHUB_TOKEN doesn't trigger the PR checks, so a
          # fine-grained token (this repo only: Contents + Pull requests write) opens it when set.
          # The translations are also validated below; a red run means don't merge the PR as is.
          GITHUB_TOKEN: ${{ secrets.CROWDIN_PR_TOKEN || secrets.GITHUB_TOKEN }}

      # The Crowdin action switches back to master when it finishes, so the validators would
      # otherwise check master instead of the translations it just pushed.
      - name: Check out the translation branch
        id: branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(gh pr list --head crowdin-translations --state open --json number --jq '.[0].number')" ]; then
            git fetch -q origin crowdin-translations
            git checkout -q crowdin-translations
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No open translation PR (nothing new from Crowdin)." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Crowdin returns a translation for a key that still has a machine draft: the draft has to
      # go, because a key in two files is an aapt duplicate-resource error. Pushed with the PR
      # token so the PR checks run again on the new commit.
      - name: Drop machine drafts that Crowdin now covers
        if: steps.branch.outputs.found == 'true'
        env:
          PUSH_TOKEN: ${{ secrets.CROWDIN_PR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/i18n/promote_drafts.py
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add manager/src/main/res
            git commit -q -m "chore(i18n): drop machine drafts now covered by Crowdin translations"
            git push -q "https://x-access-token:${PUSH_TOKEN}@github.com/${{ github.repository }}" HEAD:crowdin-translations
          fi

      - name: Validate downloaded translations
        if: steps.branch.outputs.found == 'true'
        run: |
          python3 scripts/i18n/check_translations.py
          python3 scripts/i18n/check_arrays.py
          python3 scripts/i18n/check_shrink.py --base ${{ github.sha }}

      - name: Report Download Summary
        if: success() && steps.branch.outputs.found == 'true'
        run: |
          echo "### 📥 Crowdin Translation Pull Status" >> $GITHUB_STEP_SUMMARY
          echo "Translations downloaded from [Crowdin](https://crowdin.com/project/ShizukuPlus) and validated on the crowdin-translations branch." >> $GITHUB_STEP_SUMMARY

      - name: Report Download Failure
        if: failure()
        run: |
          echo "### ❌ Crowdin Translation Pull Failed" >> $GITHUB_STEP_SUMMARY
          echo "Download or validation failed; see the step log. Don't merge the crowdin-translations PR until it's fixed." >> $GITHUB_STEP_SUMMARY

  status:
    name: Crowdin progress per language
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.direction == 'status'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Read-only: prints translated and approved percentages per language, so the repo can be
      # compared with Crowdin without a Crowdin login.
      - name: Crowdin status
        uses: crowdin/github-action@8f01d54f70f1713ee3f09d82c2bbb2daeac28689 # v2
        with:
          command: status
          command_args: '--branch master'
          config: crowdin.yml
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_TOKEN }}
