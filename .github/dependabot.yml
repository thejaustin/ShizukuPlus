# Weekly dependency update PRs. Minor and patch updates come grouped in one PR per ecosystem;
# majors come one at a time. Nothing merges automatically: a dependency bump can need new
# ProGuard keeps (manager/proguard-rules.pro), so check the release smoke test before merging.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    ignore:
      # 1.3.0 breaks configuration (MissingValueException in collectModifiers); stay on 1.2.x.
      - dependency-name: "dev.rikka.tools.autoresconfig"
        versions: ["1.3.x"]
    groups:
      # Build tooling is bumped on its own: one bad AGP/KSP/plugin bump used to sink the whole
      # grouped PR (#701). Only patches are grouped; minor/major tooling bumps arrive one by one.
      gradle-build-tooling:
        patterns:
          - "com.android.*"
          - "com.google.devtools.ksp"
          - "io.sentry.android.gradle"
          - "io.gitlab.arturbosch.detekt"
          - "com.diffplug.spotless"
          - "dev.rikka.tools.*"
        update-types: [patch]
      gradle-minor-patch:
        exclude-patterns:
          - "com.android.*"
          - "com.google.devtools.ksp"
          - "io.sentry.android.gradle"
          - "io.gitlab.arturbosch.detekt"
          - "com.diffplug.spotless"
          - "dev.rikka.tools.*"
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: [dependencies]
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
