android {
    namespace = "af.shizuku.manager"
    defaultConfig {
        applicationId = "af.shizuku.plus.api"
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionName
        def sentryDsn = project.findProperty('SENTRY_DSN') ?: ''
        buildConfigField "String", "SENTRY_DSN", "\"${sentryDsn}\""
        manifestPlaceholders = [sentryDsn: sentryDsn]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
        multiDexKeepProguard = file("multidex-keep.pro")
        externalNativeBuild {
            cmake {
                arguments = ["-DANDROID_STL=none", "-DANDROID_LD=lld", "-Wl,-z,max-page-size=16384"]
            }
        }
    }
    buildFeatures {
        buildConfig = true
        resValues = true
        viewBinding = true
        prefab = true
        aidl = true
        compose = true
    }
    signingConfigs {
        sign {}
    }
    flavorDimensions = ["distribution"]
    productFlavors {
        shizukuplus {
            dimension = "distribution"
            applicationId = "af.shizuku.plus.api"
            resValue "string", "app_name", "Shizuku+"
        }
        dropin {
            dimension = "distribution"
            applicationId = "moe.shizuku.privileged.api"
            resValue "string", "app_name", "Shizuku"
        }
    }
    buildTypes {
        debug {
            signingConfig = signingConfigs.sign
        }
        release {
            signingConfig = signingConfigs.sign
            minifyEnabled = true
            shrinkResources = true
            vcsInfo.include = false
            proguardFiles = ["proguard-rules.pro"]
        }
    }
    externalNativeBuild {
        cmake {
            path = file("src/main/jni/CMakeLists.txt")
            version = "3.22.1"
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
        // Store dex uncompressed (and page-aligned) so ART can map it straight from the APK.
        // The server runs from this APK via app_process and gets no app dexopt of its own:
        // with deflated dex it had to inflate every classes*.dex into anonymous memory on each
        // start (~1 s of class loading and tens of MB that end up in swap). Costs some APK size.
        dex {
            useLegacyPackaging = false
        }
        resources {
            excludes += ["**"]
        }
    }
    dependenciesInfo {
        includeInApk = false
    }
    lint {
        checkReleaseBuilds = false
        abortOnError = false
    }
    sourceSets {
        main {
            aidl.srcDirs = ["src/main/aidl"]
        }
    }
}

spotless {
    kotlin {
        // Source dirs only: a project-wide tree also covers src/main/assets, which
        // copyCompatApkDebug writes, and Gradle fails spotless + lint in one run.
        target fileTree("src/main/java") { include "**/*.kt" },
                fileTree("src/test/java") { include "**/*.kt" },
                fileTree("src/androidTest/java") { include "**/*.kt" }
        ktlint("1.3.1")
        trimTrailingWhitespace()
        indentWithSpaces()
        endWithNewline()
    }
}

